name: Benchmark audit

on:
  workflow_dispatch:
    inputs:
      main_candidate:
        description: Full commit of the scalar scanner on main
        type: string
        required: true
      pr_candidate:
        description: Full commit of the same scanner on the PR 394 control
        type: string
        required: true

permissions: {}

concurrency:
  group: mdream-benchmark-audit
  cancel-in-progress: false

jobs:
  audit:
    if: github.repository == 'everton-dgn/mdream'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    env:
      MAIN_CANDIDATE: ${{ inputs.main_candidate }}
      PR_CANDIDATE: ${{ inputs.pr_candidate }}
      GIT_TERMINAL_PROMPT: '0'
      GIT_CONFIG_NOSYSTEM: '1'
      GIT_CONFIG_GLOBAL: /dev/null
    steps:
      - name: Prepare evidence directory
        run: |
          audit_root="$RUNNER_TEMP/mdream-scalar-scanner"
          mkdir -p "$audit_root/results"
          printf 'AUDIT_ROOT=%s\n' "$audit_root" >> "$GITHUB_ENV"

      - name: Use Node.js 24.21.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0

      - name: Install Rust 1.99.1
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: 1.99.1
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack and wasm-opt
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: wasm-pack,wasm-opt

      - name: Pin source trees, the independent rebuild, and the unchanged harness
        shell: bash
        run: |
          set -euo pipefail
          [[ "$MAIN_CANDIDATE" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PR_CANDIDATE" =~ ^[0-9a-f]{40}$ ]]
          base=b1c86e1b3424fc1bdb605fc30cdf7d70491269fc
          control=9a796cfbda5cefb6c78f8feba00b015625a11d61
          harness=cc4a443fcd23b16b675dd87ff317ab55597fdf63
          repo="$AUDIT_ROOT/repo"
          git init "$repo"
          git -C "$repo" -c credential.helper= fetch --no-tags https://github.com/harlan-zw/mdream.git "$base" "$control"
          git -C "$repo" -c credential.helper= fetch --no-tags https://github.com/everton-dgn/mdream.git "$MAIN_CANDIDATE" "$PR_CANDIDATE" "$harness"
          test "$(git -C "$repo" show -s --format=%P "$MAIN_CANDIDATE")" = "$base"
          test "$(git -C "$repo" show -s --format=%P "$PR_CANDIDATE")" = "$control"
          test "$(git -C "$repo" show -s --format=%P "$control")" = "$base 5efa720f652b6b899b52b172f0817babbc51dc15"
          paths=$(printf '%s\n' crates/core/src/convert/mod.rs crates/core/tests/streaming_html_parity.rs)
          test "$(git -C "$repo" diff --no-renames --name-only "$base" "$MAIN_CANDIDATE")" = "$paths"
          test "$(git -C "$repo" diff --no-renames --name-only "$control" "$PR_CANDIDATE")" = "$paths"
          test "$(git -C "$repo" rev-parse "$MAIN_CANDIDATE:crates/core/src/convert/mod.rs")" = 2095fcdf892e8ad6c25dcedafd9f6b70f8609494
          test "$(git -C "$repo" rev-parse "$PR_CANDIDATE:crates/core/src/convert/mod.rs")" = 974857bb5ee5d3dcd820aec69dd67fd17f9e7791
          for revision in "$MAIN_CANDIDATE" "$PR_CANDIDATE"; do
            test "$(git -C "$repo" rev-parse "$revision:crates/core/tests/streaming_html_parity.rs")" = 03e4b72ece3426bcbf7132ebf2f2f024717ea185
          done
          git -C "$repo" worktree add --detach "$AUDIT_ROOT/base" "$base"
          git -C "$repo" worktree add --detach "$AUDIT_ROOT/base-rebuild" "$base"
          git -C "$repo" worktree add --detach "$AUDIT_ROOT/main-scalar" "$MAIN_CANDIDATE"
          git -C "$repo" worktree add --detach "$AUDIT_ROOT/pr-control" "$control"
          git -C "$repo" worktree add --detach "$AUDIT_ROOT/pr-scalar" "$PR_CANDIDATE"
          git -C "$repo" worktree add --detach "$AUDIT_ROOT/harness" "$harness"
          {
            for revision in "$base" "$MAIN_CANDIDATE" "$control" "$PR_CANDIDATE" "$harness"; do
              git -C "$repo" show -s --format='%H %T %P' "$revision"
            done
            uname -a
            node --version
            rustc -Vv
            cargo --version
            wasm-pack --version
            wasm-opt --version
            awk '/^Cpus_allowed_list:/ {print}' /proc/self/status
          } > "$AUDIT_ROOT/results/identity.txt"
          git -C "$repo" diff --binary "$base" "$MAIN_CANDIDATE" > "$AUDIT_ROOT/results/main-scalar.diff"
          git -C "$repo" diff --binary "$control" "$PR_CANDIDATE" > "$AUDIT_ROOT/results/pr-scalar.diff"

      - name: Add isolated controls without changing the canonical runner
        shell: bash
        run: |
          set -euo pipefail
          original="$AUDIT_ROOT/harness/bench/rust-perf"
          perf="$AUDIT_ROOT/experiment-rust-perf"
          cp -R "$original" "$perf"
          printf '%s\n' '{"type":"module"}' > "$perf/package.json"
          cat > "$AUDIT_ROOT/additions.txt" <<'FIXTURES'
          for (const width of [1, 2, 3]) {
            add(`audit-short-word-${width}`, `<p>${('a'.repeat(width) + ' ').repeat(28000)}</p>`)
          }
          const emphasis = '<p><strong><a href="/x">b</a> </strong><code><em>c</em></code></p><li>a<strong>(b)</strong><b>c</b></li>'.repeat(2048)
          const plainList = `<ul>${'<li>ordinary plain list item</li>'.repeat(4096)}</ul>`
          for (const [id, html] of [['audit-emphasis-stream-4k', emphasis], ['audit-plain-list-stream-4k', plainList]] as const) {
            cases.push({ id, name: id, operation: 'stream', chunks: utf8Chunks(html, 4096), options: 'default', format: 'markdown', inputBytes: Buffer.byteLength(html) })
          }
          FIXTURES
          node --input-type=module - "$perf/fixtures.ts" "$AUDIT_ROOT/additions.txt" <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs'
          const [target, additions] = process.argv.slice(2)
          const source = readFileSync(target, 'utf8')
          const marker = '  return cases\n}'
          if (source.indexOf(marker) < 0 || source.indexOf(marker) !== source.lastIndexOf(marker))
            throw new Error('Unexpected fixture source')
          writeFileSync(target, source.replace(marker, readFileSync(additions, 'utf8') + '\n' + marker))
          NODE
          cmp "$original/run.ts" "$perf/run.ts"
          cmp "$original/build.ts" "$perf/build.ts"
          sha256sum "$original/run.ts" "$perf/run.ts" "$original/fixtures.ts" "$perf/fixtures.ts" > "$AUDIT_ROOT/results/harness-sha256.txt"
          printf 'PERF_DIR=%s\n' "$perf" >> "$GITHUB_ENV"

      - name: Validate the candidate Rust trees before timings
        shell: bash
        run: |
          set -euo pipefail
          for side in main-scalar pr-scalar; do
            CARGO_TARGET_DIR="$AUDIT_ROOT/$side-test-target" cargo test --manifest-path "$AUDIT_ROOT/$side/crates/Cargo.toml" --workspace --exclude mdream-edge --locked \
              2>&1 | tee "$AUDIT_ROOT/results/$side-tests.log"
          done

      - name: Build four source variants and an independent identical-source control
        shell: bash
        run: |
          set -euo pipefail
          for side in base base-rebuild main-scalar pr-control pr-scalar; do
            source="$AUDIT_ROOT/$side"
            dist="$AUDIT_ROOT/$side-dist"
            node "$PERF_DIR/build.ts" "$source" "$dist/rust-perf" \
              2>&1 | tee "$AUDIT_ROOT/results/$side-native-build.log"
            CARGO_TARGET_DIR="$dist/wasm-target" node "$source/scripts/build-wasm-edge.mjs" --target web --out-dir "$dist/rust" \
              2>&1 | tee "$AUDIT_ROOT/results/$side-wasm-build.log"
            cp "$dist/rust-perf/build.json" "$AUDIT_ROOT/results/$side-build.json"
            cp "$dist/rust-perf/harness/Cargo.lock" "$AUDIT_ROOT/results/$side-native-Cargo.lock"
            sha256sum "$dist/rust-perf/cpu" "$dist/rust-perf/alloc" "$dist/rust/mdream_edge.js" "$dist/rust/mdream_edge_bg.wasm" >> "$AUDIT_ROOT/results/artifact-sha256.txt"
          done
          for side in base-rebuild main-scalar pr-control pr-scalar; do
            cmp "$AUDIT_ROOT/results/base-native-Cargo.lock" "$AUDIT_ROOT/results/$side-native-Cargo.lock"
          done

      - name: Run serial paired comparisons with unchanged options and thresholds
        shell: bash
        run: |
          set -euo pipefail
          cd "$AUDIT_ROOT/pr-scalar"
          for comparison in null-build main-effect pr-effect remaining-pr-cost; do
            mkdir -p "$AUDIT_ROOT/results/$comparison"
            case "$comparison" in
              null-build) first=base; second=base-rebuild ;;
              main-effect) first=base; second=main-scalar ;;
              pr-effect) first=pr-control; second=pr-scalar ;;
              remaining-pr-cost) first=main-scalar; second=pr-scalar ;;
            esac
            for filter in ascii-markdown ascii-text ascii-html audit-short-word-1 audit-short-word-2 audit-short-word-3 list-items-1x list-items-4x list-attribute-1x list-attribute-4x audit-emphasis-stream-4k audit-plain-list-stream-4k; do
              for order in aa ab ba; do
                case "$order" in
                  aa) left="$first"; right="$first" ;;
                  ab) left="$first"; right="$second" ;;
                  ba) left="$second"; right="$first" ;;
                esac
                out="$AUDIT_ROOT/results/$comparison/$filter-$order"
                RUST_PERF_FILTER="$filter" RUST_PERF_SAMPLES=12 timeout 120 node --expose-gc "$PERF_DIR/run.ts" \
                  "$AUDIT_ROOT/$left-dist" "$AUDIT_ROOT/$right-dist" "$out" 2>&1 | tee "$AUDIT_ROOT/results/$comparison/$filter-$order.log"
                jq -s -e 'length == 2 and all(.cpu != null) and (map(.cpu) | unique | length == 1)' \
                  "$out/base-rust-perf.json" "$out/pr-rust-perf.json" > /dev/null
                cpu=$(jq -c '.cpu' "$out/base-rust-perf.json")
                if [ -f "$AUDIT_ROOT/results/cpu.json" ]; then
                  test "$cpu" = "$(cat "$AUDIT_ROOT/results/cpu.json")"
                else
                  printf '%s\n' "$cpu" > "$AUDIT_ROOT/results/cpu.json"
                fi
                if [ "$comparison" != remaining-pr-cost ] || [ "$order" = aa ]; then
                  jq -s -e '.[0].verification == .[1].verification' "$out/base-rust-perf.json" "$out/pr-rust-perf.json" > /dev/null
                fi
                if [ "$order" = aa ]; then
                  jq -e '[.benches[] | select(.kind == "time" and (.informational != true))] |
                    length == 2 and all(.comparisonRme != null and .comparisonRme <= 5 and .comparisonRatio >= 0.95 and .comparisonRatio <= 1.05)' "$out/pr-rust-perf.json" > /dev/null
                fi
              done
            done
          done

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scalar-scanner-audit
          path: ${{ env.AUDIT_ROOT }}/results
          if-no-files-found: error
          retention-days: 7
